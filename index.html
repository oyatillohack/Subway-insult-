<title>Подземный бегун 3D</title>
<style>
:root{--ink:#10243a;--card:#fff7e0;--accent:#ff5a36;--hud:#fff;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f6ff;--card:#1b2a40;--accent:#ff7a59}}
html,body{height:100%;margin:0;overflow:hidden;background:#7ec8ff;font-family:"Trebuchet MS","Segoe UI",sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px 16px;color:var(--hud);font-size:22px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,30,60,.45)}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:22px 26px;text-align:center;max-width:320px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid var(--accent)}
.card h1{margin:10px 0 6px;font-size:28px}
.card p{margin:4px 0 14px;font-size:15px;line-height:1.4}
button{font:inherit;font-weight:800;font-size:20px;padding:12px 34px;border:0;border-radius:999px;background:var(--accent);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer}
#mu{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:8px 14px;font-size:20px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>

  const used=[];
  for(let r=0;r<rows;r++){
    let l;do{l=Math.floor(Math.random()*3)-1}while(used.includes(l)&&used.length<3);used.push(l);
    const k=Math.random(),x=l*LANE;
    if(k<.4){const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.6,7),mTrain);m.position.set(x,1.3,z);add(m,{k:'train',l,d:3.5})}
    else if(k<.7){const m=new THREE.Mesh(new THREE.BoxGeometry(1.9,.8,.5),mBar);m.position.set(x,.4,z);add(m,{k:'low',l,d:.5})}
    else{const m=new THREE.Mesh(new THREE.BoxGeometry(1.9,.5,.5),mHigh);m.position.set(x,1.55,z);add(m,{k:'high',l,d:.5});
      for(const s of[-.9,.9]){const p=new THREE.Mesh(new THREE.BoxGeometry(.15,1.8,.15),mHigh);p.position.set(x+s,.9,z);scene.add(p);objs.push({m:p,k:'deco',l:9,d:0})}}
  }
  const cl=Math.floor(Math.random()*3)-1;
  if(!used.includes(cl))for(let i=0;i<5;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.08,16),mCoin);c.rotation.x=Math.PI/2;c.position.set(cl*LANE,1,z-i*1.6);add(c,{k:'coin',l:cl,d:.3})}
}
function reset(){objs.forEach(o=>scene.remove(o.m));objs.length=0;lane=0;tx=0;y=0;vy=0;slide=0;speed=14;dist=0;coins=0;nextSpawn=0;hero.position.set(0,0,0)}
function start(){reset();run=true;$('ov').style.display='none';voice.currentTime=0;voice.play().catch(()=>{})}
function over(){
  run=false;voice.pause();let best=0;
  try{best=+localStorage.getItem('best')||0;if(score()>best){best=score();localStorage.setItem('best',best)}}catch(e){best=Math.max(best,score())}
  $('tt').textContent='Тебя поймали!';
  $('msg').innerHTML='Счёт: '+score()+'<br>Рекорд: '+best;
  $('go').textContent='Ещё раз';$('ov').style.display='flex';
}
const score=()=>Math.floor(dist)+coins*10;
$('go').onclick=start;
function mute(){voice.muted=!voice.muted;$('mu').textContent=voice.muted?'🔇':'🔊'}
$('mu').onclick=e=>{e.stopPropagation();mute()};
$('mu').ontouchend=e=>e.stopPropagation();
const L=()=>lane>-1&&(lane--),R=()=>lane<1&&(lane++);
function jump(){if(run&&y<=.01){vy=9.5;slide=0}}
function roll(){if(run){slide=.7;if(y>.01)vy=-14}}
addEventListener('keydown',e=>{
  if(e.key==='m')mute();
  if(!run){if(e.key==='Enter')start();return}
  const k=e.key;
  if(k==='ArrowLeft'||k==='a')L();else if(k==='ArrowRight'||k==='d')R();
  else if(k==='ArrowUp'||k==='w'||k===' ')jump();else if(k==='ArrowDown'||k==='s')roll();
});
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  if(!run)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))dx<0?L():R();else dy<0?jump():roll();
},{passive:true});

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
  if(run){
    speed=Math.min(34,speed+dt*.25);dist+=speed*dt*.1;
    tx=lane*LANE;hero.position.x+=(tx-hero.position.x)*Math.min(1,dt*14);
    vy-=26*dt;y+=vy*dt;if(y<0){y=0;vy=0}
    if(slide>0)slide-=dt;
    gt.offset.y+=speed*dt/8.6;
    nextSpawn-=speed*dt;if(nextSpawn<=0){spawn();nextSpawn=16+Math.random()*10}
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i];o.m.position.z+=speed*dt;
      if(o.k==='coin')o.m.rotation.z+=dt*5;
      const z=o.m.position.z;
      if(z>-o.d-.4&&z<o.d+.4&&Math.abs(o.m.position.x-hero.position.x)<1.1&&o.k!=='deco'){
        if(o.k==='coin'){coins++;scene.remove(o.m);objs.splice(i,1);continue}
        const top=o.k==='train'?2.6:.8;
        if(o.k==='train'&&y<2.6-.2)over();
        else if(o.k==='low'&&y<.65)over();
        else if(o.k==='high'&&slide<=0)over();
        if(!run)break;
      }
      if(z>10){scene.remove(o.m);objs.splice(i,1)}
    }
  }
  const sw=run?Math.sin(t*16)*.8:Math.sin(t*2)*.05;
  legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw;armR.rotation.x=sw;
  hero.position.y=y;
  const s=slide>0&&y<=.01;body.scale.y=s?.55:1;body.rotation.x=s?.5:0;
  head.rotation.z=run?Math.sin(t*8)*.04:0;
  cam.position.set(hero.position.x*.5,4.3,6.2);cam.lookAt(hero.position.x*.4,1.4,-6);
  $('sc').textContent=score();$('co').textContent='🪙 '+coins;
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
